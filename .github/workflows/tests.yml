name: tests
on:
  push:
  pull_request:

# The token can only read the repository: nothing here pushes, comments or publishes.
permissions:
  contents: read

# Every action is pinned by full commit SHA (the tag is in the comment), and so is every sibling repository:
# a push to a sibling, or a moved tag, cannot turn this repository red or green on its own.
#
# The tested set below is the sibling commits this Warden is tested against. A sibling's branch head being one
# or more commits ahead of its pin is expected. To bump one: change its `ref:` SHA and the version in the comment
# (in every job that checks it out, and the matching `--expect` in the `circuit` job, `pyproject.toml` for
# ghost_tools, and STACK.md), read the sibling's CHANGELOG for what moved, and run the whole job set once.
# `tests/test_docs.py` fails if the pins disagree with each other.
#   ghost_tools 1.10.9  3df51b374ed016b3f42def17c080700cd770e85a
#   SWIZZLE     0.8.8   6853c92cf000c5b86c6b83090ec192b2974b70aa
#   ASSAY       0.11.6  1de36ca9b56ba51b6b1f577bf046d7270b7e6c2a
#   JUDGE       0.4.8   e5c3f98f0f3998a8c5dac458ad0fcf4e050eb074
# These four are the last set this repository's CI tested on its own. None of them is claimed to be the head of any
# repository's `main`, and a sibling may have moved on. Whether the set that lands works together is checked by the
# `stack` job in the CNS repository (github.com/wking53214/CNS), not here. Their cns extras are at the CNS v2.0.0 tag,
# like the pin here.
# CNS is pinned by the tag `v2.0.0` in `pyproject.toml` (it peels to b13e5d2).
# The `assay-latest` job is the one place a sibling is taken at its newest commit, on purpose, and it cannot
# fail the build.
#
# A skipped test fails a job (WARDEN_FAIL_ON_SKIP=1, see tests/conftest.py): the jobs install what the
# Judge-seat and live ASSAY tests need, so a skip means a check did not run.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

  # The optional extra installs and leaves a consistent environment.
  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[ghost,dev]"
      - run: pip check

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # ASSAY is public; checking it out makes test_live_assay_registry run here instead of skipping, so a
      # broken ASSAY link turns CI red. ASSAY 0.11.6 (1de36ca).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/ASSAY
          ref: 1de36ca9b56ba51b6b1f577bf046d7270b7e6c2a
          path: _assay
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The real Judge seat, so the Judge-seat tests run here instead of skipping. JUDGE 0.4.8
      # (e5c3f98). Its only runtime dependency is cns, already installed.
      - run: pip install --no-deps "git+https://github.com/wking53214/JUDGE@e5c3f98f0f3998a8c5dac458ad0fcf4e050eb074"
      - run: pytest -q -rs
        env:
          ASSAY_ROOT: ${{ github.workspace }}/_assay
          WARDEN_FAIL_ON_SKIP: "1"

  # The horsemen circuit smoke test: the real `warden tagteam` command line against live ASSAY, ghost_tools
  # and SWIZZLE checkouts at pinned commits, and the real Judge (tools/circuit_smoke.py). Integration is
  # exercised here, not only on a developer's machine.
  circuit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # ASSAY 0.11.6 (1de36ca)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/ASSAY
          ref: 1de36ca9b56ba51b6b1f577bf046d7270b7e6c2a
          path: _circuit/ASSAY
      # ghost_tools 1.10.9 (3df51b3)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/ghost_tools
          ref: 3df51b374ed016b3f42def17c080700cd770e85a
          path: _circuit/ghost_tools
      # SWIZZLE 0.8.8 (6853c92)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/SWIZZLE
          ref: 6853c92cf000c5b86c6b83090ec192b2974b70aa
          path: _circuit/SWIZZLE
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # JUDGE 0.4.8 (e5c3f98): the real Judge decides the
      # smoke test's governed run (--real-judge).
      - run: pip install --no-deps "git+https://github.com/wking53214/JUDGE@e5c3f98f0f3998a8c5dac458ad0fcf4e050eb074"
      # ASSAY's answer key needs numpy and matplotlib: without them its verifier skips those claims and exits 1
      # (the key is then not proven and Ghost is not graded). Exact versions, so a new release cannot move the result.
      - run: pip install numpy==2.5.4 matplotlib==3.11.2
      - run: >
          python tools/circuit_smoke.py
          --ghost-tools _circuit/ghost_tools --swizzle _circuit/SWIZZLE --assay _circuit/ASSAY --real-judge
          --expect ghost_tools=3df51b374ed016b3f42def17c080700cd770e85a
          --expect swizzle=6853c92cf000c5b86c6b83090ec192b2974b70aa
          --expect assay=1de36ca9b56ba51b6b1f577bf046d7270b7e6c2a

  # Newest ASSAY, on purpose, to learn early when ASSAY's published answer key drifts from what Warden reads.
  # Never blocks a merge.
  assay-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: wking53214/ASSAY
          path: _assay
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_assay_link.py
        env:
          ASSAY_ROOT: ${{ github.workspace }}/_assay
