[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden"
dynamic = ["version"]
description = "The discipline of change: a human grant, a green suite before and after, SWIZZLE proofs, and a durable record. What counts as better lives in Burnish."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["governance", "change-control", "assurance", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    ]
# The shared rows (seat contract, defects, run record) come from the hub.
# Pinned to a full commit SHA (the v1.8.0 release); to bump it, change the SHA and the tag in the comment
# together and run the full suite.
dependencies = ["cns @ git+https://github.com/wking53214/CNS.git@5252ceebe98185f7be81212d988055ccf9884568"]  # v1.8.0

[project.urls]
Homepage = "https://github.com/wking53214/Warden"

[project.scripts]
warden = "warden.cli:main"

[project.optional-dependencies]
# ruff and mypy are pinned so the CI gates mean the same thing on every run; bump them on purpose.
dev = ["pytest>=8", "ruff==0.17.1", "mypy==2.4.0"]
# warden.ghost runs Ghost Tools when it is installed, and still reads Ghost
# JSON produced elsewhere when it is not. Declared here so the dependency is
# visible and pinned: `pip install "warden[ghost]"`. Pinned to a full commit SHA
# (ghost_tools 1.10.1, branch claude/horsemen-production-status-5wsndb, untagged); to bump it, change the SHA and
# note the version it corresponds to here, and the same SHA in .github/workflows/tests.yml and STACK.md.
ghost = ["ghost-tools @ git+https://github.com/wking53214/ghost_tools@5d7a38638b12a75b25c84ab3652e4774acb9aa10"]

[tool.setuptools]
packages = ["warden", "warden.horsemen"]

[tool.setuptools.dynamic]
# One source of truth: warden/__init__.py. `warden --version` and the wheel both read it.
version = { attr = "warden.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed long source strings and long assertions; the package itself is held to 120.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["warden"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
