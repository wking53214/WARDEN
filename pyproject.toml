[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden"
version = "0.10.1"
description = "The discipline of change: a human grant, a green suite before and after, SWIZZLE proofs, and a durable record. What counts as better lives in Burnish."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["governance", "change-control", "assurance", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    ]
dependencies = []

[project.urls]
Homepage = "https://github.com/wking53214/Warden"

[project.scripts]
warden = "warden.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# warden.ghost runs Ghost Tools when it is installed, and still reads Ghost
# JSON produced elsewhere when it is not. Declared here so the dependency is
# visible and pinned: `pip install "warden[ghost]"`. Pinned to a release tag;
# bump it on purpose.
ghost = ["ghost-tools @ git+https://github.com/wking53214/ghost_tools@V1.9.1"]

[tool.setuptools]
packages = ["warden", "warden.horsemen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
