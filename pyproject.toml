[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden"
dynamic = ["version"]
description = "The discipline of change: a human grant, a green suite before and after, SWIZZLE proofs, and a durable record. What counts as better is set by the human's requirements and the evidence Warden evaluates; optional finishing tools may propose improvements, but Warden controls whether changes stand."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["governance", "change-control", "assurance", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    ]
# The shared rows (seat contract, defects, run record) come from the hub.
# Pinned by tag, spelled the same way in every repository of the circuit (CNS's seat_pins check compares the text, and
# pip treats a tag URL and a commit URL as two sources). The tag is the commit eabe6c72d71557b6327b80b42b0afab572acce80 (a lightweight tag).
# To bump it, change the tag here and the CNS row in STACK.md together and run the full suite.
dependencies = ["cns @ git+https://github.com/wking53214/CNS.git@v4.0.0"]  # v4.0.0 = eabe6c72d71557b6327b80b42b0afab572acce80

[project.urls]
Homepage = "https://github.com/wking53214/Warden"

[project.scripts]
warden = "warden.cli:main"

[project.optional-dependencies]
# ruff and mypy are pinned so the CI gates mean the same thing on every run; bump them on purpose.
dev = ["pytest>=8", "ruff==0.17.1", "mypy==2.4.0"]
# warden.ghost runs Ghost Tools when it is installed, and still reads Ghost
# JSON produced elsewhere when it is not. Declared here so the dependency is
# visible and pinned: `pip install -e '.[ghost]'` from a checkout (a bare `warden` on PyPI is another project). Pinned to a full commit SHA
# (ghost_tools 1.10.14); to bump it, change the SHA and
# note the version it corresponds to here, and the same SHA in .github/workflows/tests.yml and STACK.md.
ghost = ["ghost-tools @ git+https://github.com/wking53214/ghost_tools@b7c99afa5afecc34052ec2aa15ca3f17379f7d9c"]

[tool.setuptools]
packages = ["warden", "warden.horsemen"]

[tool.setuptools.dynamic]
# One source of truth: warden/__init__.py. `warden --version` and the wheel both read it.
version = { attr = "warden.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["isolation_default: runs with the shipped isolation default (cli.ISOLATE_BY_DEFAULT) instead of off"]

[tool.ruff]
line-length = 120
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed long source strings and long assertions; the package itself is held to 120.
"tests/*" = ["E501"]
# test_isolated_seat reuses the real-CLI rig fixture by importing it; pytest wants it as an argument name.
"tests/test_isolated_seat.py" = ["F811"]
"tests/test_isolation_default.py" = ["F811"]
"tests/test_stability.py" = ["F811"]

[tool.mypy]
python_version = "3.11"
files = ["warden"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
